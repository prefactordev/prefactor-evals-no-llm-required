name: CI

# The library's whole claim is that results are deterministic and safe to gate a
# build on. That claim is worth nothing if the suite only ever runs on the
# author's machine, so it runs on every push and every pull request, across the
# Python versions the package says it supports.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of what pyproject declares, plus one
        # non-Linux runner: path handling and line endings differ there, and
        # this library was written on Windows.
        python: ["3.10", "3.13"]
        os: [ubuntu-latest]
        include:
          - python: "3.13"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        working-directory: packages/python
        run: python -m pip install -e ".[dev]"

      - name: Test
        working-directory: packages/python
        run: python -m pytest tests -q

  no-llm:
    # The package is named for what it does not do. A model client arriving by
    # way of a transitive dependency would break the promise quietly, so it is
    # checked rather than trusted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: No model client in the source
        run: |
          if grep -rniE '\b(openai|anthropic|cohere|mistralai|google\.generativeai|litellm|langchain_openai)\b' \
               packages/python/src --include='*.py'; then
            echo "::error::a model client appears in the source of a no-LLM package"
            exit 1
          fi
          echo "no model client in source"

      - name: No network outside the seam
        run: |
          offenders=$(grep -rlE '\b(urllib|requests|httpx|aiohttp|socket)\b' \
            packages/python/src/prefactor_evals_no_llm --include='*.py' \
            | grep -v '/source.py$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::network access outside the seam: $offenders"
            exit 1
          fi
          echo "all network access confined to source.py"

      - name: Install and check the dependency tree
        working-directory: packages/python
        run: |
          python -m pip install -e . --quiet
          python - <<'PY'
          import importlib.metadata as md
          deps = md.requires("prefactor-evals-no-llm") or []
          print("declared dependencies:", deps)
          banned = ("openai", "anthropic", "cohere", "litellm", "langchain")
          bad = [d for d in deps if any(b in d.lower() for b in banned)]
          assert not bad, "model client in dependencies: %s" % bad
          PY

  house-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No em dashes or smart quotes
        run: |
          # House rule, and a practical one: these characters get mangled by
          # terminals and by the quality summary field this tool writes to.
          if grep -rnP '[\x{2014}\x{2013}\x{2018}\x{2019}\x{201C}\x{201D}]' \
               --include='*.py' --include='*.md' --include='*.yaml' \
               --include='*.yml' --include='*.bat' . ; then
            echo "::error::em dash, en dash or smart quote found"
            exit 1
          fi
          echo "clean"
